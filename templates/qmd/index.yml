# qmd 설정 예시. `~/.config/qmd/index.yml` 에 놓는다.
#
# 두 경로를 자기 기록 폴더로 바꾼다. LESSONS_VAULT 와 같은 곳이어야 한다.
# Windows 는 `C:\Users\<계정>\...`, WSL·macOS·Linux 는 `/home/<계정>/...` 꼴로 적는다.
#
# lessons 컬렉션은 필수다. lesson-recall.py 가 `-c lessons` 로 이 이름을 부른다.
# vault 컬렉션은 교훈 말고 다른 노트까지 검색하고 싶을 때만 둔다.

collections:
  vault:
    path: /path/to/your/vault
    pattern: "**/*.md"
  lessons:
    path: /path/to/your/vault/Lessons
    pattern: "**/*.md"

# 모델 셋 다 GGUF 로 이 PC 에서 돈다. 처음 한 번 내려받고 나면 API 호출이 없다.
# 합계 2.6 GB 안팎이고 `~/.cache/qmd/models/` 에 들어간다.
models:
  embed: hf:Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
